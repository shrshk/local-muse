server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker's DNS. Upstreams are variables so nginx re-resolves them when a container is
    # recreated with a new IP (otherwise it keeps the address from its own startup).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;
    set $centrifugo http://centrifugo:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A dense local model can take minutes per turn (backend model timeout is 600 s).
        proxy_read_timeout 620s;
    }

    location /connection/ {
        proxy_pass $centrifugo;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # The shell must revalidate so a reload always picks up a new build; hashed assets can cache.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
