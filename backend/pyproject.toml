[project]
name = "muse"
version = "0.1.0"
description = "Local Muse backend: API, Temporal workers, agent runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.31",
    "alembic>=1.20",
    "temporalio>=1.33",
    "httpx>=0.28",
    "pyjwt>=2.15",
    "pydantic>=2.11",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=2.3",
    "websockets>=17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/muse"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "G", "LOG", "TID251", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use muse.shared.logger.get_logger instead."

[tool.ruff.lint.isort]
# The local alembic/ directory would otherwise make the package look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"src/muse/shared/logger.py" = ["TID251"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Header"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["muse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: needs the running Compose stack (make up-detached)",
]
addopts = "-m 'not integration'"
