# Test-only overlay: a fake Telegram API and a backend pointed at it. Used by
# backend/tests/integration/test_telegram.py, which restores the normal backend afterwards.
services:
  telegram-mock:
    image: local-muse-backend:local
    command: ["python", "/support/telegram_mock.py"]
    environment:
      MOCK_TOKEN: test-token
    volumes:
      - ../backend/tests/support:/support:ro
    ports:
      - "127.0.0.1:${TELEGRAM_MOCK_PORT:-18081}:8081"
    mem_limit: 128m

  backend:
    environment:
      TELEGRAM_BOT_TOKEN: test-token
      TELEGRAM_API_BASE: http://telegram-mock:8081
      TELEGRAM_ALLOWED_CHAT_IDS: "111"
      TELEGRAM_OWNER_USERNAME: ${TELEGRAM_OWNER_USERNAME:?set by the test}
      TELEGRAM_POLL_TIMEOUT_S: "2"
    depends_on:
      telegram-mock:
        condition: service_started
