[project]
name = "sandboxd"
version = "0.1.0"
description = "Local Muse sandbox controller: the only holder of the Docker socket"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.54",
    "docker>=7.2",
    "pydantic-settings>=2.15",
    "structlog>=26.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
    "mypy>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandboxd"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "G", "LOG", "TID251", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use sandboxd.logger.get_logger instead."

[tool.ruff.lint.per-file-ignores]
"src/sandboxd/logger.py" = ["TID251"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sandboxd"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
